<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPOCH</title>
<link rel="stylesheet" href="css/style.css?v=3bbd0b18">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-chip" id="era-chip" title="Click for era requirements">
    
    <div class="era-name">…</div>
    <div id="era-track"><div id="era-bar"></div></div>
  </div>
  <div class="hud-chip">
    <div class="hud-label">Treasury</div>
    <div class="hud-val" id="hud-money">$0</div>
    <div class="hud-sub" id="hud-net">+0/s</div>
  </div>
  
  <div class="hud-chip" id="rent-chip" title="City standing — how much of what this age can pay you the city has actually captured">
    <div class="hud-label">Standing</div>
    <div class="hud-val gold" id="hud-rent">$0.0000000</div>
    <div class="hud-sub gold-dim" id="hud-rent-rate">Hall L1</div>
  </div>
</div>

<div id="resbar">
  <div class="res" title="Charter Points — accrue 1/hour on the real clock. Nothing speeds them up."><span class="res-ico">📜</span><span id="hud-cp">0</span></div>
  <div class="res" title="Builders — each construction site occupies one"><span class="res-ico">🏗️</span><span id="hud-builders">0 / 0</span></div>
  <div class="res"><span class="res-ico">👤</span><span id="hud-pop">0 / 0</span></div>
  <div class="res"><span class="res-ico">🔨</span><span id="hud-workers">0 / 0</span></div>
  <div class="res"><span class="res-ico">🌾</span><span id="hud-grain">0</span></div>
  <div class="res"><span class="res-ico">🍞</span><span id="hud-flour">0</span></div>
  <div class="res hidden" id="chip-stone"><span class="res-ico">🪨</span><span id="hud-stone">0</span></div>
  <div class="res hidden" id="chip-blocks"><span class="res-ico">🧱</span><span id="hud-blocks">0</span></div>
  <div class="res hidden" id="chip-water" title="The city's water tank. Everything that needs water goes dark the moment this reaches zero."><span class="res-ico">💧</span><span id="hud-water">0</span></div>
  <div class="res hidden" id="chip-season" title="The year: the rains fill your tanks, the dry season empties them."><span class="res-ico">🌦️</span><span id="hud-season">—</span></div>
  <div class="res hidden" id="chip-fuel" title="The city's fuel, in delivered warmth: wood ×1, bone ×1, charcoal ×3. When it cannot cover the fires' draw, every hearth goes dark at once."><span class="res-ico">🔥</span><span id="hud-fuel">0</span></div>
  <div class="res hidden" id="chip-silt" title="The canals. Every well lays down silt; dredging crews clear it. As it rises, every well reaches less ground."><span class="res-ico">🛶</span><span id="hud-silt">0%</span></div>
  <div class="res hidden" id="chip-range" title="The foraging territory. Two camps of the SAME KIND within reach of each other work the same herd or the same hillside and split it. It never recovers by waiting — the only fix is distance."><span class="res-ico">🏹</span><span id="hud-range">100%</span></div>
  <div class="res hidden" id="chip-herd" title="The colony. Predators take a share of the herd every minute, and the share rises with the tree cover within six tiles of each nest. Growing is the defence."><span class="res-ico">🦕</span><span id="hud-herd">0</span></div>
  <div class="res hidden" id="chip-levy" title="The levy. A share of every unit of gold is taken as it is poured, and the masters call in a quota on a fixed clock — each one larger than the last."><span class="res-ico">⚖️</span><span id="hud-levy">0</span></div>
  <div class="res hidden" id="chip-grid" title="The grid. A rectangle 5–8 tiles a side with road on all four sides, every tile inside it built, and the whole thing inside a Covered Drain’s reach, is a BLOCK: +30% output, −10% upkeep, +1 resident a home."><span class="res-ico">📐</span><span id="hud-grid">0%</span></div>
  <div class="res hidden" id="chip-head" title="Head. A Diversion Gate emits a fixed budget every minute and it only ever runs downhill — level, or one step down, never up. A Bunded Rice Field draws 2.0 of it, so three fields to a gate. A field with no head still takes 15% off the rain."><span class="res-ico">🌊</span><span id="hud-head">0</span></div>
  <div class="res hidden" id="chip-reach" title="Reach. A Canoe Landing standing on open water opens every shore within 26 tiles of sea as ground you may buy, at 2.5× the parcel price. A Wayfinding Court adds 6 tiles to every Landing; each rank adds 2. Ownership is permanent — a Landing that stops running takes nothing back."><span class="res-ico">🛶</span><span id="hud-reach">0</span></div>
  <div class="res hidden" id="chip-roll" title="The roll. Everything that produces or ships must stand inside a magazine’s disc, and the palace can only carry as many of them as it can issue a ration to — oil and figs, every minute, per building on the roll. It drops the furthest ones first."><span class="res-ico">📜</span><span id="hud-roll">0</span></div>
  <div class="res hidden" id="chip-unrest" title="Unrest. It rises when a count is missed and falls when one is settled. Past the first mark the masters take people; past the second the picks slow."><span class="res-ico">✊</span><span id="hud-unrest">0%</span></div>
  <div class="res hidden" id="chip-census" title="The census. Your city is governed by the last census it took. A building placed since then is built, staffed and working — and INVISIBLE to the state: shops do not sell to the people in it, the treasury collects no tributum from them, and the era gate does not count them. They still eat. Order a lustrum at the Hall."><span class="res-ico">🏛️</span><span id="hud-census">100%</span></div>
  <div class="res hidden" id="chip-table" title="The table. No single food may cover more than its share of a citizen's meal — bread half, figs, pulses and fish a quarter each. A full granary and nothing else feeds half your city. The answer is never more of what you already have."><span class="res-ico">⚖️</span><span id="hud-table">100%</span></div>
</div>

<div id="controls">
  <button id="spd-pause" title="Pause / Resume (Space)">❚❚</button>
  <button id="btn-overlay" title="Overlays: coverage, then the salt map (O)">Coverage</button>
  
  <button id="btn-tally" class="hidden" title="What this city produces (T)">Tally</button>
  <button id="btn-chron" title="This city's own history (C)">Chronicle</button>
  <button id="btn-guide" title="Guide for this era (G)">Era Guide</button>
  <button id="btn-help" title="Controls &amp; basics (H)">Help</button>
  <button id="btn-save" title="Save now (Ctrl+S) — the city also autosaves every 10s">Save</button>
  
  <button id="btn-backups" title="Backups: rolling auto-backups, and export your city to a file">Backups</button>
  <button id="btn-reset" title="Start a new world">New</button>
</div>

<div id="inspector" class="hidden"></div>
<div id="palette"></div>
<div id="toasts"></div>


<script src="js/vendor/three.min.js?v=3bbd0b18"></script>
<script src="js/util.js?v=3bbd0b18"></script>
<script src="js/data.js?v=3bbd0b18"></script>
<script src="js/grid.js?v=3bbd0b18"></script>
<script src="js/state.js?v=3bbd0b18"></script>
<script src="js/econ.js?v=3bbd0b18"></script>
<script src="js/guide.js?v=3bbd0b18"></script>

<script src="js/gfx.js?v=3bbd0b18"></script>
<script src="js/shapes.js?v=3bbd0b18"></script>
<script src="js/render.js?v=3bbd0b18"></script>
<script src="js/ui.js?v=3bbd0b18"></script>
<script src="js/input.js?v=3bbd0b18"></script>
<script src="js/main.js?v=3bbd0b18"></script>
</body>
</html>
