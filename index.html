<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPOCH — Era 1 Prototype</title>
<link rel="stylesheet" href="css/style.css?v=30b7bda3">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-chip" id="era-chip" title="Click for era requirements">
    <div class="era-name">Era 1 · Anunnaki</div>
    <div id="era-track"><div id="era-bar"></div></div>
  </div>
  <div class="hud-chip">
    <div class="hud-label">Treasury</div>
    <div class="hud-val" id="hud-money">$0</div>
    <div class="hud-sub" id="hud-net">+0/s</div>
  </div>
  <div class="hud-chip" id="rent-chip" title="Real-money rent accrued by your Town Hall — upgrade it to earn faster">
    <div class="hud-label">Real Rent Accrued</div>
    <div class="hud-val gold" id="hud-rent">$0.0000000</div>
    <div class="hud-sub gold-dim" id="hud-rent-rate">Hall L1</div>
  </div>
</div>

<div id="resbar">
  <div class="res" title="Charter Points — accrue 1/hour on the real clock. Nothing speeds them up."><span class="res-ico">📜</span><span id="hud-cp">0</span></div>
  <div class="res" title="Builders — each construction site occupies one"><span class="res-ico">🏗️</span><span id="hud-builders">0 / 0</span></div>
  <div class="res"><span class="res-ico">👤</span><span id="hud-pop">0 / 0</span></div>
  <div class="res"><span class="res-ico">🔨</span><span id="hud-workers">0 / 0</span></div>
  <div class="res"><span class="res-ico">🌾</span><span id="hud-grain">0</span></div>
  <div class="res"><span class="res-ico">🍞</span><span id="hud-flour">0</span></div>
  <div class="res hidden" id="chip-stone"><span class="res-ico">🪨</span><span id="hud-stone">0</span></div>
  <div class="res hidden" id="chip-blocks"><span class="res-ico">🧱</span><span id="hud-blocks">0</span></div>
  <div class="res hidden" id="chip-water" title="The city's water tank. Everything that needs water goes dark the moment this reaches zero."><span class="res-ico">💧</span><span id="hud-water">0</span></div>
  <div class="res hidden" id="chip-season" title="The year: the rains fill your tanks, the dry season empties them."><span class="res-ico">🌦️</span><span id="hud-season">—</span></div>
  <div class="res hidden" id="chip-fuel" title="The city's fuel, in delivered warmth: wood ×1, bone ×1, charcoal ×3. When it cannot cover the fires' draw, every hearth goes dark at once."><span class="res-ico">🔥</span><span id="hud-fuel">0</span></div>
</div>

<div id="controls">
  <button id="spd-pause" title="Pause / Resume (Space)">❚❚</button>
  <button id="btn-overlay" title="Overlays: coverage, then the salt map (O)">Coverage</button>
  <button id="btn-tally" class="hidden" title="The Scribe's tally: what the city produces (T)">Tally</button>
  <button id="btn-chron" title="The Clay Tablet Chronicle — your city's history (C)">Chronicle</button>
  <button id="btn-guide" title="Guide for this era (G)">Era Guide</button>
  <button id="btn-help" title="Controls &amp; basics (H)">Help</button>
  <button id="btn-save" title="Save now (Ctrl+S) — the city also autosaves every 10s">Save</button>
  <button id="btn-sound" title="Sound on/off">🔊</button>
  <button id="btn-reset" title="Start a new world">New</button>
</div>

<div id="inspector" class="hidden"></div>
<div id="palette"></div>
<div id="toasts"></div>


<script src="js/vendor/three.min.js?v=30b7bda3"></script>
<script src="js/util.js?v=30b7bda3"></script>
<script src="js/data.js?v=30b7bda3"></script>
<script src="js/grid.js?v=30b7bda3"></script>
<script src="js/state.js?v=30b7bda3"></script>
<script src="js/econ.js?v=30b7bda3"></script>
<script src="js/guide.js?v=30b7bda3"></script>

<script src="js/gfx.js?v=30b7bda3"></script>
<script src="js/shapes.js?v=30b7bda3"></script>
<script src="js/render.js?v=30b7bda3"></script>
<script src="js/audio.js?v=30b7bda3"></script>
<script src="js/ui.js?v=30b7bda3"></script>
<script src="js/input.js?v=30b7bda3"></script>
<script src="js/main.js?v=30b7bda3"></script>
</body>
</html>
